name: Assistant evals

# Live evals call Claude and cost money, so they run after merges to main and
# on demand rather than on every pull request.
on:
  push:
    branches: [main]
    paths: ["subtrack-backend/**"]
  workflow_dispatch:

jobs:
  live-evals:
    name: Live evals
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: subtrack-backend
    env:
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
    steps:
      - uses: actions/checkout@v7

      - name: Skip without an API key
        if: env.ANTHROPIC_API_KEY == ''
        run: echo "::notice::ANTHROPIC_API_KEY is not set, so live evals were skipped."

      - uses: actions/setup-python@v7
        if: env.ANTHROPIC_API_KEY != ''
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: subtrack-backend/requirements-dev.txt

      - name: Install dependencies
        if: env.ANTHROPIC_API_KEY != ''
        run: pip install -r requirements-dev.txt

      - name: Run live evals
        if: env.ANTHROPIC_API_KEY != ''
        # bash adds pipefail, so a regression still fails the step through tee.
        shell: bash
        run: python -m evals.run_live --report eval-report.json | tee -a "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        if: always() && env.ANTHROPIC_API_KEY != ''
        with:
          name: eval-report
          path: subtrack-backend/eval-report.json
          if-no-files-found: ignore
